<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Chooser</title>
</head>
<body>
  <form>
    <label>出发地 <input name="from" value="北京(BJS)"></label>
    <label>目的地 <input name="to" value="北京(BJS)"></label>
    <div class="city-dropdown" style="position: absolute; top: 80px; left: 24px; width: 360px; padding: 8px; background: #fff; border: 1px solid #ddd;">
      <div>上海</div>
      <div>北京</div>
      <div>成都</div>
      <div>广州</div>
    </div>
    <div class="date-picker" style="position: absolute; top: 200px; left: 24px; width: 420px; padding: 8px; background: #fff; border: 1px solid #ddd;">
      <div>2026年9月 日一二三四五六</div>
      <div class="panel">
        <div><span>2026年10月</span></div>
        <div><div>1</div><div>7</div></div>
      </div>
      <div class="panel">
        <div><span>2026年11月</span></div>
        <div><div>1</div><div>7</div></div>
      </div>
    </div>
  </form>
</body>
</html>
